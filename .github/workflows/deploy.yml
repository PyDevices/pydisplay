name: Deploy PyScript site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'lib/**'
      - 'packages/**'
      - 'scripts/install_gen_manifests.py'
      - 'scripts/install_refresh_manifests.sh'
      - 'scripts/gallery_generator.py'
      - 'scripts/pyscript_stamp_pwa_cache.py'
      - '.github/workflows/deploy-pyscript.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pydevices (product sources for PyScript mounts)
        uses: actions/checkout@v4
        with:
          repository: PyDevices/pydevices
          path: pydevices
          sparse-checkout: |
            utils
            lib/eventsys
            lib/multimer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify install manifest freshness
        run: ./scripts/install_refresh_manifests.sh --audit

      - name: Verify PyScript gallery manifests
        run: python scripts/gallery_generator.py --check

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p _site/pyscript
          cp -r web/pyscript/* _site/pyscript/
          # web/pyscript/lib and web/pyscript/packages are symlinks for local
          # dev; replace with real trees for GitHub Pages.
          rm -rf _site/pyscript/lib _site/pyscript/src _site/pyscript/packages
          mkdir -p _site/pyscript/lib _site/pyscript/packages
          cp -r lib/utils _site/pyscript/lib/
          cp -r pydevices/lib/eventsys pydevices/lib/multimer _site/pyscript/lib/
          # Hardware-owned helpers (mip.py, byteswap, …) — PyScript [files] still
          # fetch them at lib/utils/<name>.py (browser URL under web/pyscript/).
          cp pydevices/utils/byteswap.py \
             pydevices/utils/frame_recorder.py \
             pydevices/utils/keypins.py \
             pydevices/utils/micropython.py \
             pydevices/utils/mip.py \
             pydevices/utils/viper_tools.py \
             pydevices/utils/wifi.py \
             _site/pyscript/lib/utils/
          cp lib/jupyter_notebook.ipynb _site/pyscript/lib/
          python scripts/gallery_generator.py --copy-examples _site/pyscript/lib/examples
          # Example + lib MIP manifests; relative urls resolve via packages/ → ../lib/
          cp packages/*.json _site/pyscript/packages/
          cp web/landing/index.html _site/index.html
          cp web/landing/site.css _site/site.css
          cp .nojekyll _site/
          # Stamp CACHE_NAME from a hash of the PWA shell (STATIC_ASSETS + sw.js).
          # Example/src churn alone does not change the id — installed apps are
          # only prompted when the offline shell actually changes.
          python scripts/pyscript_stamp_pwa_cache.py _site/pyscript

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
