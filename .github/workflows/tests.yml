name: Unit tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/utils/**'
      - 'src/examples/**'
      - 'tests/**'
      - 'scripts/**'
      - 'web/pyscript/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/utils/**'
      - 'src/examples/**'
      - 'tests/**'
      - 'scripts/**'
      - 'web/pyscript/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canonical product packages
        uses: actions/checkout@v4
        with:
          repository: PyDevices/micropython-hardware
          path: micropython-hardware
          sparse-checkout: |
            drivers/display/displaydev
            drivers/audio/audiodev
            lib
            utils
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: pip install pygame-ce ruff

      - name: Run stdlib unittest suite
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v
