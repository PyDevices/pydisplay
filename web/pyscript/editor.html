<!DOCTYPE html>
<html>
    <head>
        <title>PyDisplay Editor</title>
        <link rel="manifest" href="./manifest.json">
        <meta name="theme-color" content="#f54e00">
        <script src="./pwa.js"></script>
    </head>
    <body>
        <canvas id="display_canvas" width="1" height="1" style="background-color: black; border:2px solid black;"></canvas>
        <!-- Hidden bootstrap: mip + path. Runs before the visible editor. -->
        <script type="mpy-editor" env="demo" setup data-configs="./micropython.json ./pydisplay.json">
            import mip
            mip.install("github:PyDevices/pydisplay/src/examples/pydisplay_demo.py")
            import utils.path
        </script>
        <!-- Visible lesson: edit and press Run. Shares env with setup. -->
        <script type="mpy-editor" env="demo">
            import pydisplay_demo
        </script>
        <script type="module" src="./pyscript-json-config.js"></script>
    </body>
</html>
